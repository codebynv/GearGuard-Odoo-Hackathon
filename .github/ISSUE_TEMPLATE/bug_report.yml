name: Bug report
description: Report a reproducible GearGuard issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Odoo version and relevant context
      description: Do not include credentials or private records.
    validations:
      required: false
